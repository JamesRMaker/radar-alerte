# Fabrique l'APK à chaque envoi de code et le publie dans « Releases ».
# Lien de téléchargement direct :
#   https://github.com/<utilisateur>/<dépôt>/releases/latest/download/RadarAlerte.apk
name: Fabriquer l'APK

on:
  push:
    branches: [main]
    paths-ignore: ["anglais/**", ".github/workflows/anglais-*.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Rust pour Android
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo install cargo-ndk --version "^3" --locked

      - name: Tests du cœur Rust
        working-directory: rust/radar-core
        run: cargo test

      - name: Clé de signature (secrets du dépôt)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Ajoutez les secrets KEYSTORE_B64 et KEYSTORE_PASSWORD (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          echo "$KEYSTORE_B64" | tr -d ' \n\r' | base64 -d > "$RUNNER_TEMP/radar.jks"
          echo "RADAR_KEYSTORE=$RUNNER_TEMP/radar.jks" >> "$GITHUB_ENV"

      - name: Compilation de l'APK
        working-directory: android
        env:
          RADAR_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ../RadarAlerte.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RadarAlerte
          path: RadarAlerte.apk

      - name: Publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" RadarAlerte.apk \
            --title "Radar Alerte (version ${{ github.run_number }})" \
            --notes "Téléchargez RadarAlerte.apk ci-dessous et ouvrez-le sur votre téléphone." \
            --latest
