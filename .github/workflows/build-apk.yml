# Fabrique l'APK à chaque envoi de code et le publie dans « Releases ».
# Lien de téléchargement direct :
#   https://github.com/<utilisateur>/<dépôt>/releases/latest/download/RadarAlerte.apk
name: Fabriquer l'APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Rust pour Android
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo install cargo-ndk --version "^3" --locked

      - name: Tests du cœur Rust
        working-directory: rust/radar-core
        run: cargo test

      - name: Compilation de l'APK
        working-directory: android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ../RadarAlerte.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RadarAlerte
          path: RadarAlerte.apk

      - name: Publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" RadarAlerte.apk \
            --title "Radar Alerte (version ${{ github.run_number }})" \
            --notes "Téléchargez RadarAlerte.apk ci-dessous et ouvrez-le sur votre téléphone." \
            --latest
